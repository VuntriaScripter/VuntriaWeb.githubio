<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vuntria Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #ffffff;
            min-height: 100vh;
        }

        /* =========================================
           HEADER
        ========================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 75px;

            display: flex;
            align-items: center;

            padding: 0 45px;

            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid #222222;

            z-index: 1000;
        }

        /* RED V ICON */

        .logo {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ff0000;

            font-size: 29px;
            font-weight: 900;

            border: 2px solid #ff0000;
            border-radius: 10px;

            box-shadow: 0 0 20px rgba(255, 0, 0, 0.20);
        }

        /* SITE NAME */

        .brand {
            margin-left: 15px;

            font-size: 21px;
            font-weight: 700;

            letter-spacing: 2px;
        }

        .brand span {
            color: #ff0000;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero {
            min-height: 100vh;

            position: relative;

            display: flex;
            align-items: center;

            padding: 120px 8% 80px;

            overflow: hidden;
        }

        /* BACKGROUND IMAGE */

        .hero::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    90deg,
                    #050505 0%,
                    rgba(5, 5, 5, 0.96) 25%,
                    rgba(5, 5, 5, 0.65) 55%,
                    rgba(5, 5, 5, 0.20) 100%
                ),
                url("anime-anime-girls-black-background-monochrome-hd-wallpaper-preview.jpg");

            background-size: cover;
            background-position: center;

            filter: grayscale(100%);

            z-index: -1;
        }

        .content {
            width: 100%;
            max-width: 700px;
        }

        .welcome {
            color: #ff0000;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 5px;

            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(55px, 8vw, 100px);

            line-height: 0.9;

            letter-spacing: -4px;

            margin-bottom: 25px;
        }

        h1 span {
            color: #ff0000;
        }

        .description {
            max-width: 550px;

            color: #aaaaaa;

            font-size: 16px;
            line-height: 1.7;

            margin-bottom: 45px;
        }


        /* =========================================
           ZIP SECTION
        ========================================= */

        .upload-container {
            width: 100%;
            max-width: 650px;
        }

        .upload-title {
            color: #ffffff;

            font-size: 14px;
            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        .upload-title span {
            color: #ff0000;
        }

        .upload-box {
            width: 100%;

            min-height: 230px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 30px;

            background: rgba(8, 8, 8, 0.90);

            border: 2px dashed #444444;
            border-radius: 8px;

            transition: 0.3s;
        }

        .upload-box:hover {
            border-color: #ff0000;

            background: rgba(15, 15, 15, 0.95);

            box-shadow: 0 0 30px rgba(255, 0, 0, 0.10);
        }


        /* ZIP ICON */

        .zip-icon {
            width: 55px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 18px;

            color: #ff0000;

            font-size: 16px;
            font-weight: bold;

            border: 2px solid #ff0000;
            border-radius: 6px;
        }


        /* ZIP TEXT */

        .upload-box h2 {
            font-size: 20px;

            margin-bottom: 8px;

            text-align: center;
        }

        .upload-box p {
            color: #777777;

            font-size: 13px;

            margin-bottom: 20px;

            text-align: center;
        }


        /* =========================================
           IMPORTANT ZIP LINK
        ========================================= */

        /*
        ==================================================
        🔴🔴🔴 LIEN DE TON FICHIER ZIP À METTRE ICI 🔴🔴🔴

        REMPLACE UNIQUEMENT "LienZIP Ici"
        PAR TON VRAI LIEN ZIP.

        Exemple :

        const ZIP_LINK = "https://exemple.com/monfichier.zip";

        ==================================================
        */

        const {
        }


        /* =========================================
           ZIP BUTTON
        ========================================= */

        .zip-button {
            display: inline-block;

            padding: 14px 28px;

            background: #ff0000;

            color: #ffffff;

            text-decoration: none;

            border: 1px solid #ff0000;
            border-radius: 4px;

            font-size: 12px;
            font-weight: bold;

            letter-spacing: 1.5px;

            transition: 0.3s;
        }

        .zip-button:hover {
            background: transparent;

            color: #ff0000;

            box-shadow: 0 0 25px rgba(255, 0, 0, 0.20);
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {
            padding: 25px;

            text-align: center;

            color: #555555;

            background: #050505;

            border-top: 1px solid #1c1c1c;

            font-size: 11px;

            letter-spacing: 1px;
        }

        footer span {
            color: #ff0000;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            header {
                padding: 0 20px;
            }

            .brand {
                font-size: 17px;
            }

            .hero {
                padding: 110px 7% 70px;
            }

            .hero::before {
                background-position: 65% center;
            }

            h1 {
                font-size: 60px;
            }

            .upload-box {
                min-height: 210px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================================
         HEADER
    ========================================= -->

    <header>

        <div class="logo">
            V
        </div>

        <div class="brand">
            Vuntria <span>Manager</span>
        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="hero">

        <div class="content">

            <div class="welcome">
                VUNTRIA
            </div>

            <h1>
                Vuntria <span>Manager</span>
            </h1>

            <p class="description">
                Welcome to Vuntria Manager.
                Manage your files quickly and easily
                with a simple and modern interface.
            </p>


            <!-- =====================================
                 ZIP FILE AREA
            ====================================== -->

            <div class="upload-container">

                <div class="upload-title">
                    <span>01.</span> ZIP FILE
                </div>

                <div class="upload-box">

                    <div class="zip-icon">
                        ZIP
                    </div>

                    <h2>
                        YOUR ZIP FILE
                    </h2>

                    <p>
                        Click the button below to access your ZIP file.
                    </p>

                    <!--
                    🔴🔴🔴 LIEN ZIP À MODIFIER 🔴🔴🔴

                    C'EST ICI QUE TU METS TON LIEN.

                    REMPLACE :

                    LienZIP Ici

                    PAR TON LIEN.

                    Exemple :
                    https://monsite.com/fichier.zip
                    -->

                    <a
                        href="https://github.com/ic3w0lf22/Roblox-Account-Manager/releases/download/3.6.1/Roblox.Account.Manager.3.6.1.zip"
                        class="zip-button"
                        target="_blank"
                    >
                        OPEN ZIP FILE
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer>
        VUNTRIA MANAGER <span>©</span> 2026
    </footer>


</body>
</html>
