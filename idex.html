<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vuntria Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           BARRE DU HAUT
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;

            display: flex;
            align-items: center;

            padding: 0 40px;

            background: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid #222;

            backdrop-filter: blur(12px);

            z-index: 100;
        }

        /* ICON V */

        .icon-v {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ff0000;

            font-size: 32px;
            font-weight: 900;

            border: 2px solid #ff0000;
            border-radius: 10px;

            margin-right: 15px;

            box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
        }

        /* NOM */

        .title {
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .title span {
            color: #ff0000;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding: 120px 8%;

            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    90deg,
                    #050505 0%,
                    rgba(5, 5, 5, 0.95) 30%,
                    rgba(5, 5, 5, 0.65) 55%,
                    rgba(5, 5, 5, 0.25) 100%
                ),
                url("anime-anime-girls-black-background-monochrome-hd-wallpaper-preview.jpg");

            background-size: cover;
            background-position: center;

            filter: grayscale(100%);

            z-index: -1;
        }

        .hero-content {
            max-width: 600px;
        }

        .small-title {
            color: #ff0000;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 5px;
            text-transform: uppercase;

            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(55px, 8vw, 100px);

            line-height: 0.9;

            letter-spacing: -4px;

            margin-bottom: 25px;
        }

        h1 span {
            color: #ff0000;
        }

        .description {
            color: #aaa;

            font-size: 16px;
            line-height: 1.8;

            margin-bottom: 40px;
        }

        /* =========================
           BOUTON
        ========================= */

        .btn {
            display: inline-block;

            padding: 15px 30px;

            background: #ff0000;
            color: white;

            text-decoration: none;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 2px;

            border: 1px solid #ff0000;

            transition: 0.3s;
        }

        .btn:hover {
            background: transparent;
            color: #ff0000;

            box-shadow: 0 0 25px rgba(255, 0, 0, 0.2);
        }

        /* =========================
           SECTION ZIP
        ========================= */

        .zip-section {
            padding: 100px 8%;

            background: #080808;

            border-top: 1px solid #202020;
        }

        .zip-section h2 {
            font-size: 38px;

            margin-bottom: 12px;
        }

        .zip-section h2 span {
            color: #ff0000;
        }

        .zip-description {
            color: #777;

            margin-bottom: 35px;
        }

        /* ZONE ZIP */

        .zip-box {
            max-width: 700px;

            padding: 45px;

            background: #0e0e0e;

            border: 2px dashed #444;

            text-align: center;

            transition: 0.3s;
        }

        .zip-box:hover {
            border-color: #ff0000;

            background: #111;
        }

        .zip-icon {
            font-size: 45px;

            color: #ff0000;

            margin-bottom: 20px;
        }

        .zip-placeholder {
            color: #aaa;

            font-size: 18px;

            margin-bottom: 25px;
        }

        /* CHAMP */

        .zip-input {
            width: 100%;

            padding: 16px;

            background: #050505;

            color: white;

            border: 1px solid #333;

            outline: none;

            text-align: center;

            font-size: 14px;
        }

        .zip-input:focus {
            border-color: #ff0000;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 30px;

            text-align: center;

            color: #555;

            background: #050505;

            border-top: 1px solid #1c1c1c;

            font-size: 13px;
        }

        footer span {
            color: #ff0000;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 0 20px;
            }

            .title {
                font-size: 17px;
            }

            .hero {
                padding: 120px 7%;
            }

            .hero::before {
                background-position: 65% center;
            }

            h1 {
                font-size: 60px;
            }

            .zip-section {
                padding: 70px 7%;
            }

            .zip-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="icon-v">
            V
        </div>

        <div class="title">
            Vuntria <span>Manager</span>
        </div>

    </header>


    <!-- =========================
         ACCUEIL
    ========================= -->

    <section class="hero">

        <div class="hero-content">

            <div class="small-title">
                Vuntria
            </div>

            <h1>
                Vuntria <span>Manager</span>
            </h1>

            <p class="description">
                Bienvenue sur Vuntria Manager.
                Gérez vos fichiers et vos projets depuis
                une interface simple, sombre et moderne.
            </p>

            <a href="#zip" class="btn">
                COMMENCER
            </a>

        </div>

    </section>


    <!-- =========================
         FICHIER ZIP
    ========================= -->

    <section class="zip-section" id="zip">

        <h2>
            Ajouter un <span>fichier ZIP</span>
        </h2>

        <p class="zip-description">
            Ajoutez votre fichier ZIP dans la zone ci-dessous.
        </p>

        <div class="zip-box">

            <div class="zip-icon">
                V
            </div>

            <div class="zip-placeholder">
                Fichier ZIP mettre ici
            </div>

            <input
                type="text"
                class="zip-input"
                placeholder="Fichier ZIP mettre ici"
            >

        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>
        © 2026 <span>Vuntria Manager</span>
    </footer>

</body>
</html>
